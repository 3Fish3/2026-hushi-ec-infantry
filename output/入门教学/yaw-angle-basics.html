<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>底盘与云台角度入门</title>
  <style>
    :root {
      --font-size-base: 16px;
      --border: #cbd5e1;
      --muted: #e2e8f0;
      --muted-foreground: #64748b;
      --viz-series-1: #2563eb;
      --viz-series-2: #d97706;
    }
  </style>
</head>
<body>
<div id="infantry-yaw-basics">
  <div class="viz-controls">
    <label class="form-label" for="iyb-base">底盘方向 β：<output id="iyb-base-value" class="tabular-nums">0°</output>
      <input id="iyb-base" class="form-range" type="range" min="-180" max="180" value="0" step="1">
    </label>
    <label class="form-label" for="iyb-joint">云台关节角 q：<output id="iyb-joint-value" class="tabular-nums">0°</output>
      <input id="iyb-joint" class="form-range" type="range" min="-180" max="180" value="0" step="1">
    </label>
  </div>
  <label class="form-check form-switch">
    <input id="iyb-hold" class="form-check-input" type="checkbox">
    <span class="form-check-label">理想稳向（仅几何演示）</span>
  </label>
  <svg id="iyb-view" role="img" aria-labelledby="iyb-title iyb-description" width="100%" height="280">
    <title id="iyb-title">底盘与云台的水平俯视图</title>
    <desc id="iyb-description">虚线表示底盘前方，实线表示枪口方向。上方是固定的零度方向，逆时针为正。</desc>
    <g id="iyb-fixed" stroke="var(--border)" stroke-width="1" fill="none">
      <circle id="iyb-circle"></circle>
      <line id="iyb-horizontal"></line>
      <line id="iyb-vertical"></line>
    </g>
    <text id="iyb-zero" text-anchor="middle" fill="var(--muted-foreground)">固定参考 0°</text>
    <g id="iyb-chassis">
      <rect x="-53" y="-64" width="106" height="128" rx="8" fill="var(--muted)" fill-opacity="0.55" stroke="var(--border)" stroke-width="1"></rect>
      <g fill="var(--muted-foreground)">
        <rect x="-65" y="-49" width="12" height="32" rx="3"></rect>
        <rect x="53" y="-49" width="12" height="32" rx="3"></rect>
        <rect x="-65" y="17" width="12" height="32" rx="3"></rect>
        <rect x="53" y="17" width="12" height="32" rx="3"></rect>
      </g>
      <line x1="0" y1="0" x2="0" y2="-94" stroke="var(--viz-series-2)" stroke-width="3" stroke-dasharray="6 4"></line>
      <polyline points="-7,-85 0,-95 7,-85" fill="none" stroke="var(--viz-series-2)" stroke-width="3"></polyline>
    </g>
    <g id="iyb-barrel" fill="var(--viz-series-1)">
      <circle cx="0" cy="0" r="12"></circle>
      <rect x="-5" y="-106" width="10" height="106" rx="3"></rect>
      <polygon points="0,-119 -11,-101 11,-101"></polygon>
    </g>
  </svg>
  <div class="viz-row" aria-label="图例">
    <span><span class="iyb-key iyb-base-key" aria-hidden="true"></span>底盘前方（虚线）</span>
    <span><span class="iyb-key iyb-gun-key" aria-hidden="true"></span>枪口方向（实线）</span>
  </div>
  <p id="iyb-reading" class="tabular-nums" aria-live="polite">关节编码器 0° · IMU 航向 0°</p>
</div>
<style>
  #infantry-yaw-basics {display:grid;gap:calc(var(--font-size-base) * 0.75);}
  #infantry-yaw-basics .iyb-key {display:inline-block;width:1.5em;margin-right:0.4em;vertical-align:middle;}
  #infantry-yaw-basics .iyb-base-key {border-top:3px dashed var(--viz-series-2);}
  #infantry-yaw-basics .iyb-gun-key {border-top:3px solid var(--viz-series-1);}
  #infantry-yaw-basics #iyb-view {display:block;overflow:visible;}
</style>
<script>
(() => {
  const root = document.getElementById('infantry-yaw-basics');
  const pick = id => root.querySelector('#' + id);
  const base = pick('iyb-base');
  const joint = pick('iyb-joint');
  const hold = pick('iyb-hold');
  const svg = pick('iyb-view');
  let lockedHeading = 0;
  const wrap = angle => ((angle + 180) % 360 + 360) % 360 - 180;
  const degrees = angle => (Math.round(angle) === 0 ? 0 : Math.round(angle)) + '°';
  const attributes = (element, values) => Object.entries(values).forEach(([key,value]) => element.setAttribute(key, String(value)));

  function render() {
    const beta = Number(base.value);
    if (hold.checked) joint.value = String(wrap(lockedHeading - beta));
    joint.disabled = hold.checked;
    const q = Number(joint.value);
    const heading = wrap(beta + q);
    const width = Math.max(280, svg.getBoundingClientRect().width);
    const cx = width / 2;
    const cy = 146;
    const radius = 108;
    attributes(pick('iyb-circle'), {cx,cy,r:radius});
    attributes(pick('iyb-horizontal'), {x1:cx-radius,y1:cy,x2:cx+radius,y2:cy});
    attributes(pick('iyb-vertical'), {x1:cx,y1:cy-radius,x2:cx,y2:cy+radius});
    attributes(pick('iyb-zero'), {x:cx,y:16});
    pick('iyb-chassis').setAttribute('transform', 'translate(' + cx + ' ' + cy + ') rotate(' + (-beta) + ')');
    pick('iyb-barrel').setAttribute('transform', 'translate(' + cx + ' ' + cy + ') rotate(' + (-heading) + ')');
    pick('iyb-base-value').textContent = degrees(beta);
    pick('iyb-joint-value').textContent = degrees(q);
    pick('iyb-reading').textContent = '关节编码器 ' + degrees(q) + ' · IMU 航向 ' + degrees(heading);
    pick('iyb-description').textContent = '水平俯视，逆时针为正。底盘方向' + degrees(beta) + '，云台相对底盘' + degrees(q) + '，枪口航向' + degrees(heading) + '。理想稳向' + (hold.checked ? '开启。' : '关闭。');
  }
  function save() {
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({modelContent:{baseDegrees:Number(base.value),jointDegrees:Number(joint.value),idealHold:hold.checked},privateContent:{lockedHeading}}).catch(() => {});
    }
  }
  function restore(state) {
    const data = state && state.modelContent;
    if (data && Number.isFinite(data.baseDegrees) && Number.isFinite(data.jointDegrees)) {
      base.value = String(wrap(data.baseDegrees));
      joint.value = String(wrap(data.jointDegrees));
      hold.checked = data.idealHold === true;
      lockedHeading = wrap(Number(base.value) + Number(joint.value));
    }
    render();
  }
  base.addEventListener('input', () => {render();});
  joint.addEventListener('input', () => {render();});
  base.addEventListener('change', save);
  joint.addEventListener('change', save);
  hold.addEventListener('change', () => {
    lockedHeading = wrap(Number(base.value) + Number(joint.value));
    render();
    save();
  });
  window.addEventListener('openai:set_globals', event => {
    const globals = event.detail && event.detail.globals;
    if (globals && Object.prototype.hasOwnProperty.call(globals, 'widgetState')) restore(globals.widgetState);
  });
  new ResizeObserver(render).observe(root);
  restore(window.openai && window.openai.widgetState);
})();
</script>
</body>
</html>
